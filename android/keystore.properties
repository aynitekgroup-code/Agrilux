# Agrilux - Release signing configuration
# For Play Store publishing, create a keystore and fill in these values

# Generate keystore with:
# keytool -genkey -v -keystore agrilux-release.keystore -alias agrilux -keyalg RSA -keysize 2048 -validity 10000

# Then fill in:
KEYSTORE_FILE=../agrilux-release.keystore
KEYSTORE_PASSWORD=your_password_here
KEY_ALIAS=agrilux
KEY_PASSWORD=your_password_here
