async function upsertBatch(table, rows) {
  const url = SUPABASE_URL + '/rest/v1/' + table;
  let ok = 0, fail = 0;
  // Insert in batches of 10
  for (let i = 0; i < rows.length; i += 10) {
    const batch = rows.slice(i, i + 10);
    const resp = await fetch(url, {
      method: 'POST',
      headers: {
        'apikey': SERVICE_KEY,
        'Authorization': 'Bearer ' + SERVICE_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates'
      },
      body: JSON.stringify(batch)
    });
    if (resp.ok) {
      ok += batch.length;
      log('  OK ' + batch.length + '/' + rows.length, 'ok');
    } else {
      const txt = await resp.text();
      fail += batch.length;
      log('  ERROR: ' + txt, 'err');
      // Try one by one
      for (const row of batch) {
        const r2 = await fetch(url, {
          method: 'POST',
          headers: {
            'apikey': SERVICE_KEY,
            'Authorization': 'Bearer ' + SERVICE_KEY,
            'Content-Type': 'application/json',
            'Prefer': 'resolution=merge-duplicates'
          },
          body: JSON.stringify(row)
        });
        if (r2.ok) { ok++; fail--; }
        else { log('    FAIL row ' + row.id + ': ' + await r2.text(), 'err'); }
      }
    }
  }
  return { ok, fail };
}

async function startImport() {
  document.getElementById('btnImport').disabled = true;
  const tables = Object.keys(DATA);
  let totalOk = 0, totalFail = 0;
  for (const table of tables) {
    const rows = DATA[table];
    log('\n>> Importando ' + table + ' (' + rows.length + ' filas)...', 'info');
    const { ok, fail } = await upsertBatch(table, rows);
    totalOk += ok;
    totalFail += fail;
    log('   Resultado: ' + ok + ' OK, ' + fail + ' errores', ok === rows.length ? 'ok' : 'err');
  }
  log('\n=== COMPLETADO === ' + totalOk + ' inserts OK, ' + totalFail + ' errores', totalOk > totalFail ? 'ok' : 'err');
  document.getElementById('btnImport').disabled = false;
}
