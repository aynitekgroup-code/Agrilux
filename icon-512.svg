<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D5A3D"/>
      <stop offset="100%" style="stop-color:#1E3D2A"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Leaf icon -->
  <g transform="translate(256, 220)">
    <!-- Main leaf -->
    <path d="M0-120 C60-120 120-60 120 0 C120 80 60 140 0 160 C-60 140-120 80-120 0 C-120-60-60-120 0-120Z" fill="#4CAF50"/>
    <!-- Leaf vein -->
    <path d="M0-100 L0 140" stroke="#2E7D32" stroke-width="4" fill="none"/>
    <path d="M0-40 L40-70" stroke="#2E7D32" stroke-width="3" fill="none"/>
    <path d="M0 20 L50 0" stroke="#2E7D32" stroke-width="3" fill="none"/>
    <path d="M0 80 L45 60" stroke="#2E7D32" stroke-width="3" fill="none"/>
    <path d="M0-40 L-40-70" stroke="#2E7D32" stroke-width="3" fill="none"/>
    <path d="M0 20 L-50 0" stroke="#2E7D32" stroke-width="3" fill="none"/>
    <path d="M0 80 L-45 60" stroke="#2E7D32" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Text A -->
  <text x="256" y="230" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">A</text>
  
  <!-- App name -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">AGRILUX</text>
</svg>
