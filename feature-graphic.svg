<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D5A3D"/>
      <stop offset="50%" style="stop-color:#1E3D2A"/>
      <stop offset="100%" style="stop-color:#152E1F"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="150" cy="250" r="180" fill="#3D7A4D" opacity="0.3"/>
  <circle cx="874" cy="250" r="150" fill="#3D7A4D" opacity="0.3"/>
  
  <!-- Leaf decorations -->
  <g transform="translate(100, 150) scale(0.5)" opacity="0.4">
    <path d="M0-100 C50-100 100-50 100 0 C100 60 50 110 0 130 C-50 110-100 60-100 0 C-100-50-50-100 0-100Z" fill="#4CAF50"/>
  </g>
  <g transform="translate(900, 350) scale(0.4) rotate(45)" opacity="0.4">
    <path d="M0-100 C50-100 100-50 100 0 C100 60 50 110 0 130 C-50 110-100 60-100 0 C-100-50-50-100 0-100Z" fill="#4CAF50"/>
  </g>
  
  <!-- Main leaf icon -->
  <g transform="translate(250, 250)">
    <path d="M0-80 C40-80 80-40 80 0 C80 50 40 90 0 110 C-40 90-80 50-80 0 C-80-40-40-80 0-80Z" fill="#4CAF50"/>
    <path d="M0-60 L0 90" stroke="#2E7D32" stroke-width="3" fill="none"/>
    <path d="M0-20 L30-45" stroke="#2E7D32" stroke-width="2" fill="none"/>
    <path d="M0 20 L35 5" stroke="#2E7D32" stroke-width="2" fill="none"/>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">A</text>
  </g>
  
  <!-- Title -->
  <text x="420" y="200" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white">AGRILUX</text>
  
  <!-- Subtitle -->
  <text x="420" y="280" font-family="Arial, sans-serif" font-size="32" fill="#A8D5BA">Agricultura Inteligente</text>
  
  <!-- Features -->
  <text x="420" y="340" font-family="Arial, sans-serif" font-size="24" fill="#FFFFFF">Diagnóstico IA • Clima • Precios del Mercado</text>
</svg>
